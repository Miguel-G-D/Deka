[project]
name = "deka-agent"
version = "0.1.0"
description = "Deka LangChain reservation agent"
requires-python = ">=3.12"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
